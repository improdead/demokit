<!doctype html><meta charset=utf-8><title>Trident · Findings</title>
<style>
:root{--bg:#0d1117;--panel:#151b23;--line:#232b36;--fg:#e6edf3;--dim:#8b949e;--acc:#4f8cff;--red:#f85149;--amb:#d29922;--grn:#3fb950}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,"SF Pro Text",Inter,system-ui;background:var(--bg);color:var(--fg)}
.app{display:grid;grid-template-columns:216px 1fr;height:100vh}
aside{background:#0a0e14;border-right:1px solid var(--line);padding:18px 14px}
.logo{display:flex;gap:8px;align-items:center;font-weight:650;letter-spacing:-.2px;margin-bottom:22px}
.logo i{width:18px;height:18px;border-radius:5px;background:linear-gradient(140deg,#4f8cff,#8b5cf6);display:block}
nav a{display:block;padding:7px 10px;border-radius:7px;color:var(--dim);text-decoration:none;margin-bottom:2px}
nav a.on{background:#161d27;color:var(--fg)}
main{padding:26px 30px;overflow:auto}
h1{font-size:19px;margin:0 0 3px;letter-spacing:-.3px}
.sub{color:var(--dim);font-size:13px;margin-bottom:20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px}
.kpi b{display:block;font-size:23px;font-weight:620;letter-spacing:-.6px}
.kpi span{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);font-weight:560;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid #1b222c}
tbody tr:hover{background:#182029;cursor:pointer}
.sev{font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;border:1px solid}
.critical{color:var(--red);border-color:#4c1d1b;background:#2a1315}
.high{color:var(--amb);border-color:#463414;background:#241c0d}
.medium{color:#58a6ff;border-color:#1b3350;background:#111d2e}
.repo{color:var(--dim);font-variant-numeric:tabular-nums}
.ago{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--line);border-radius:12px;padding:56px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:5px}
#drawer{position:fixed;inset:0 0 0 auto;width:520px;background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;padding:24px 26px;overflow:auto}
#drawer.open{transform:none}
#drawer h2{font-size:16px;margin:0 0 4px}
pre{background:#0a0e14;border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo}
.ins{color:var(--grn)}.del{color:var(--red)}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.primary{background:var(--acc);color:#fff;font-weight:560}
.ghost{background:#1b222c;color:var(--fg);border:1px solid var(--line)}
#patch{margin-top:16px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:s .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
#intercom{position:fixed;right:20px;bottom:20px;width:52px;height:52px;border-radius:50%;background:#4f8cff;box-shadow:0 6px 20px #0008}
</style>
<div class=app>
<aside>
  <div class=logo><i></i>Trident</div>
  <nav>
    <a class=on href="#">Findings</a><a href="#">Repositories</a><a href="#">Policies</a><a href="#">Integrations</a><a href="#">Settings</a>
  </nav>
</aside>
<main>
  <h1>Findings</h1>
  <div class=sub id=sub>Loading…</div>
  <div class=kpis id=kpis></div>
  <div id=body></div>
</main>
</div>
<div id=drawer></div>
<div id=intercom></div>
<script>
const $=s=>document.querySelector(s);
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/6e4);
  return m<60?m+"m ago":m<1440?Math.round(m/60)+"h ago":Math.round(m/1440)+"d ago"};
let DATA=[];
fetch('/api/findings?status=open').then(r=>r.json()).then(d=>{
  DATA=d.findings||[];
  $('#sub').textContent=DATA.length?DATA.length+" open findings across "+new Set(DATA.map(f=>f.repo)).size+" repositories":"Nothing to review";
  if(!DATA.length){$('#body').innerHTML='<div class=empty><b>No findings yet</b>Connect a repository and Trident will start scanning.</div>';return}
  const by=s=>DATA.filter(f=>f.severity===s).length;
  $('#kpis').innerHTML=[["Open",DATA.length],["Critical",by("critical")],["High",by("high")],["Mean time to fix",d.mttf||"—"]]
    .map(([k,v])=>`<div class=kpi><b>${v}</b><span>${k}</span></div>`).join('');
  $('#body').innerHTML=`<table><thead><tr><th>Finding</th><th>Severity</th><th>Repository</th><th style=text-align:right>Detected</th></tr></thead>
    <tbody>${DATA.map((f,i)=>`<tr data-row=${i}><td>${f.title}</td><td><span class="sev ${f.severity}">${f.severity}</span></td>
    <td class=repo>${f.repo}<span style=opacity:.5> · ${f.path}</span></td><td class=ago>${ago(f.detectedAt)}</td></tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('tr[data-row]').forEach(tr=>tr.onclick=()=>open_(DATA[+tr.dataset.row]));
});
function open_(f){
  $('#drawer').className='open';
  $('#drawer').innerHTML=`<h2>${f.title}</h2><div class=sub>${f.repo} · ${f.path}:${f.line} · <span class="sev ${f.severity}">${f.severity}</span></div>
   <pre>${(f.evidence||'').replace(/</g,'&lt;')}</pre>
   <button class=primary id=gen>Generate fix</button> <button class=ghost>Dismiss</button><div id=patch></div>`;
  $('#gen').onclick=()=>{
    $('#gen').innerHTML='<span class=spin></span>Generating…';
    fetch('/api/findings/'+f.id+'/patch',{method:'POST'}).then(r=>r.json()).then(p=>{
      $('#gen').textContent='Generate fix';
      $('#patch').innerHTML=`<div class=sub style=margin:14px_0_6px>Proposed patch · ${p.file}</div><pre id=diff>`+
        p.diff.split('\n').map(l=>l.startsWith('+')?`<span class=ins>${esc(l)}</span>`:l.startsWith('-')?`<span class=del>${esc(l)}</span>`:esc(l)).join('\n')+
        `</pre><button class=primary id=apply>Open pull request</button>`;
    });
  };
}
const esc=s=>s.replace(/</g,'&lt;');
</script>
